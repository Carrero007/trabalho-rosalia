<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Clientes - Instituição Financeira</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #0f172a;
            min-height: 100vh;
            padding: 20px;
            color: #e2e8f0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: linear-gradient(145deg, #1e293b, #334155);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid #334155;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            margin-bottom: 30px;
            text-align: center;
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
        }

        .subtitle {
            color: #94a3b8;
            font-size: 16px;
            letter-spacing: 1px;
        }

        .tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .tab-button {
            flex: 1;
            padding: 18px;
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            color: #94a3b8;
            transition: all 0.3s;
        }

            .tab-button:hover {
                border-color: #38bdf8;
                color: #38bdf8;
                transform: translateY(-2px);
                box-shadow: 0 5px 20px rgba(56, 189, 248, 0.3);
            }

            .tab-button.active {
                background: linear-gradient(145deg, #0ea5e9, #38bdf8);
                color: #0f172a;
                border-color: #38bdf8;
                box-shadow: 0 8px 30px rgba(56, 189, 248, 0.5);
            }

        .tab-content {
            display: none;
            background: linear-gradient(145deg, #1e293b, #334155);
            padding: 35px;
            border-radius: 20px;
            border: 1px solid #334155;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

            .tab-content.active {
                display: block;
                animation: slideIn 0.4s ease-out;
            }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #cbd5e1;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select, textarea {
            width: 100%;
            padding: 14px;
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 10px;
            font-size: 15px;
            color: #e2e8f0;
            transition: all 0.3s;
        }

            input:focus, select:focus, textarea:focus {
                outline: none;
                border-color: #38bdf8;
                background: #1e293b;
                box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
            }

        .tipo-cliente {
            display: flex;
            gap: 25px;
            margin-bottom: 25px;
            padding: 20px;
            background: #0f172a;
            border-radius: 12px;
            border: 2px solid #334155;
        }

            .tipo-cliente label {
                display: flex;
                align-items: center;
                cursor: pointer;
                padding: 10px 20px;
                border-radius: 8px;
                transition: all 0.3s;
            }

                .tipo-cliente label:hover {
                    background: #1e293b;
                }

            .tipo-cliente input[type="radio"] {
                width: 20px;
                height: 20px;
                margin-right: 10px;
                accent-color: #38bdf8;
            }

        .campos-especificos {
            display: none;
        }

            .campos-especificos.active {
                display: block;
                animation: slideIn 0.4s ease-out;
            }

        .btn {
            padding: 16px 35px;
            background: linear-gradient(145deg, #0ea5e9, #38bdf8);
            color: #0f172a;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            transition: all 0.3s;
            box-shadow: 0 5px 20px rgba(56, 189, 248, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

            .btn:hover {
                transform: translateY(-3px);
                box-shadow: 0 10px 30px rgba(56, 189, 248, 0.6);
            }

            .btn:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }

        .btn-secondary {
            background: linear-gradient(145deg, #475569, #64748b);
            box-shadow: 0 5px 20px rgba(71, 85, 105, 0.4);
        }

        .clientes-grid {
            display: grid;
            gap: 25px;
        }

        .cliente-card {
            background: linear-gradient(145deg, #0f172a, #1e293b);
            padding: 25px;
            border-radius: 15px;
            border: 2px solid #334155;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: all 0.3s;
            position: relative;
        }

            .cliente-card::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                width: 4px;
                height: 100%;
                background: linear-gradient(180deg, #38bdf8, #0ea5e9);
            }

            .cliente-card:hover {
                transform: translateX(5px);
                border-color: #38bdf8;
                box-shadow: 0 15px 40px rgba(56, 189, 248, 0.3);
            }

        .cliente-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 2px solid #334155;
        }

        .cliente-nome {
            font-size: 20px;
            font-weight: 700;
            color: #38bdf8;
        }

        .cliente-tipo {
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tipo-pf {
            background: linear-gradient(145deg, #0ea5e9, #38bdf8);
            color: #0f172a;
        }

        .tipo-pj {
            background: linear-gradient(145deg, #8b5cf6, #a78bfa);
            color: #fff;
        }

        .cliente-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .info-item {
            font-size: 14px;
            color: #94a3b8;
            padding: 8px;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 6px;
        }

        .info-label {
            font-weight: 700;
            color: #cbd5e1;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
        }

        .filtros {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .filtro-group {
            flex: 1;
            min-width: 220px;
        }

        .alert {
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 25px;
            font-weight: 600;
            border-left: 4px solid;
        }

        .alert-success {
            background: rgba(34, 197, 94, 0.1);
            color: #4ade80;
            border-color: #22c55e;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border-color: #ef4444;
        }

        .alert-info {
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            border-color: #0ea5e9;
        }

        .row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        h2, h3 {
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #38bdf8;
        }

            .loading::after {
                content: '...';
                animation: dots 1.5s infinite;
            }

        @keyframes dots {
            0%, 20% {
                content: '.';
            }

            40% {
                content: '..';
            }

            60%, 100% {
                content: '...';
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏦 Sistema de Gestão de Clientes</h1>
            <p class="subtitle">Instituição Financeira | Gerenciamento PF e PJ</p>
        </header>

        <div class="tabs">
            <button class="tab-button active" onclick="abrirTab('cadastro')">
                ➕ Cadastrar Cliente
            </button>
            <button class="tab-button" onclick="abrirTab('listagem')">
                📋 Listar Clientes
            </button>
        </div>

        <!-- TAB CADASTRO -->
        <div id="cadastro" class="tab-content active">
            <h2 style="margin-bottom: 25px;">Cadastro de Cliente</h2>

            <div id="mensagem"></div>

            <form id="formCliente" onsubmit="cadastrarCliente(event)">
                <div class="tipo-cliente">
                    <label>
                        <input type="radio" name="tipoCliente" value="PF" checked onchange="alterarTipo()">
                        <strong>Pessoa Física (PF)</strong>
                    </label>
                    <label>
                        <input type="radio" name="tipoCliente" value="PJ" onchange="alterarTipo()">
                        <strong>Pessoa Jurídica (PJ)</strong>
                    </label>
                </div>

                <div class="row">
                    <div class="form-group">
                        <label id="labelNome">Nome Completo *</label>
                        <input type="text" id="nome" required placeholder="Digite o nome completo">
                    </div>

                    <div class="form-group">
                        <label>E-mail *</label>
                        <input type="email" id="email" required placeholder="exemplo@email.com">
                    </div>
                </div>

                <div class="row">
                    <div class="form-group">
                        <label>Telefone *</label>
                        <input type="tel" id="telefone" required placeholder="(00) 00000-0000">
                    </div>

                    <div class="form-group">
                        <label>Endereço</label>
                        <input type="text" id="endereco" placeholder="Rua, número - cidade/UF">
                    </div>
                </div>

                <!-- Campos Pessoa Física -->
                <div id="camposPF" class="campos-especificos active">
                    <h3 style="margin: 25px 0 15px;">Dados Pessoa Física</h3>
                    <div class="row">
                        <div class="form-group">
                            <label>CPF *</label>
                            <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14">
                        </div>

                        <div class="form-group">
                            <label>RG</label>
                            <input type="text" id="rg" placeholder="00.000.000-0">
                        </div>

                        <div class="form-group">
                            <label>Data de Nascimento *</label>
                            <input type="date" id="dataNascimento">
                        </div>
                    </div>
                </div>

                <!-- Campos Pessoa Jurídica -->
                <div id="camposPJ" class="campos-especificos">
                    <h3 style="margin: 25px 0 15px;">Dados Pessoa Jurídica</h3>
                    <div class="row">
                        <div class="form-group">
                            <label>CNPJ *</label>
                            <input type="text" id="cnpj" placeholder="00.000.000/0000-00" maxlength="18">
                        </div>

                        <div class="form-group">
                            <label>Inscrição Estadual</label>
                            <input type="text" id="inscricaoEstadual" placeholder="000.000.000.000">
                        </div>
                    </div>

                    <div class="row">
                        <div class="form-group">
                            <label>Nome do Responsável</label>
                            <input type="text" id="nomeResponsavel" placeholder="Nome completo">
                        </div>

                        <div class="form-group">
                            <label>Data de Abertura</label>
                            <input type="date" id="dataAbertura">
                        </div>
                    </div>
                </div>

                <div style="display: flex; gap: 15px; margin-top: 30px;">
                    <button type="submit" class="btn" id="btnCadastrar">✓ Cadastrar Cliente</button>
                    <button type="button" class="btn btn-secondary" onclick="limparFormulario()">✗ Limpar</button>
                </div>
            </form>
        </div>

        <!-- TAB LISTAGEM -->
        <div id="listagem" class="tab-content">
            <h2 style="margin-bottom: 25px;">Clientes Cadastrados</h2>

            <div class="filtros">
                <div class="filtro-group">
                    <label>Filtrar por Tipo:</label>
                    <select id="filtroTipo" onchange="carregarClientes()">
                        <option value="TODOS">Todos</option>
                        <option value="PF">Pessoa Física (PF)</option>
                        <option value="PJ">Pessoa Jurídica (PJ)</option>
                    </select>
                </div>

                <div class="filtro-group">
                    <label>Buscar:</label>
                    <input type="text" id="busca" placeholder="Nome, CPF ou CNPJ" oninput="filtrarClientesLocal()">
                </div>
            </div>

            <div id="listaClientes" class="clientes-grid">
                <div class="loading">Carregando clientes</div>
            </div>
        </div>
    </div>

    <script>
        // Configuração da API C#
        const API_URL = 'http://localhost:5000/api';
        let todosClientes = [];

        // Alterar campos conforme tipo de cliente
        function alterarTipo() {
            const tipo = document.querySelector('input[name="tipoCliente"]:checked').value;
            const camposPF = document.getElementById('camposPF');
            const camposPJ = document.getElementById('camposPJ');
            const labelNome = document.getElementById('labelNome');

            if (tipo === 'PF') {
                camposPF.classList.add('active');
                camposPJ.classList.remove('active');
                labelNome.textContent = 'Nome Completo *';

                document.getElementById('cpf').required = true;
                document.getElementById('dataNascimento').required = true;
                document.getElementById('cnpj').required = false;
            } else {
                camposPJ.classList.add('active');
                camposPF.classList.remove('active');
                labelNome.textContent = 'Razão Social *';

                document.getElementById('cnpj').required = true;
                document.getElementById('cpf').required = false;
                document.getElementById('dataNascimento').required = false;
            }
        }

        // Cadastrar cliente
        async function cadastrarCliente(event) {
            event.preventDefault();

            const btnCadastrar = document.getElementById('btnCadastrar');
            btnCadastrar.disabled = true;
            btnCadastrar.textContent = 'Cadastrando...';

            const tipo = document.querySelector('input[name="tipoCliente"]:checked').value;

            const dados = {
                tipo: tipo,
                nome: document.getElementById('nome').value,
                email: document.getElementById('email').value,
                telefone: document.getElementById('telefone').value,
                endereco: document.getElementById('endereco').value || null
            };

            if (tipo === 'PF') {
                dados.cpf = document.getElementById('cpf').value;
                dados.rg = document.getElementById('rg').value || null;
                dados.dataNascimento = document.getElementById('dataNascimento').value || null;
            } else {
                dados.cnpj = document.getElementById('cnpj').value;
                dados.inscricaoEstadual = document.getElementById('inscricaoEstadual').value || null;
                dados.nomeResponsavel = document.getElementById('nomeResponsavel').value || null;
                dados.dataAbertura = document.getElementById('dataAbertura').value || null;
            }

            try {
                const response = await fetch(`${API_URL}/clientes`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(dados)
                });

                const resultado = await response.json();

                if (response.ok) {
                    mostrarMensagem(resultado.mensagem, 'success');
                    limparFormulario();
                } else {
                    mostrarMensagem(resultado.erro || 'Erro ao cadastrar cliente', 'error');
                }
            } catch (erro) {
                console.error('Erro:', erro);
                mostrarMensagem('Erro ao conectar com o servidor. Verifique se a API está rodando.', 'error');
            } finally {
                btnCadastrar.disabled = false;
                btnCadastrar.textContent = '✓ Cadastrar Cliente';
            }
        }

        // Carregar clientes do banco de dados
        async function carregarClientes() {
            const lista = document.getElementById('listaClientes');
            lista.innerHTML = '<div class="loading">Carregando clientes</div>';

            const filtroTipo = document.getElementById('filtroTipo').value;
            const url = filtroTipo === 'TODOS'
                ? `${API_URL}/clientes`
                : `${API_URL}/clientes/filtrar/${filtroTipo}`;

            try {
                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error('Erro ao carregar clientes');
                }

                todosClientes = await response.json();
                exibirClientes(todosClientes);
            } catch (erro) {
                console.error('Erro ao carregar clientes:', erro);
                lista.innerHTML = `
                    <div class="alert alert-error">
                        ⚠️ Erro ao carregar clientes. Verifique se a API está rodando em ${API_URL}
                    </div>
                `;
            }
        }

        // Exibir clientes
        function exibirClientes(clientes) {
            const lista = document.getElementById('listaClientes');

            if (clientes.length === 0) {
                lista.innerHTML = '<div class="alert alert-info">📋 Nenhum cliente cadastrado.</div>';
                return;
            }

            lista.innerHTML = clientes.map(cliente => {
                const dataNasc = cliente.Data_Nascimento
                    ? new Date(cliente.Data_Nascimento).toLocaleDateString('pt-BR')
                    : 'N/A';
                const dataAbert = cliente.Data_Abertura
                    ? new Date(cliente.Data_Abertura).toLocaleDateString('pt-BR')
                    : 'N/A';

                return `
                    <div class="cliente-card">
                        <div class="cliente-header">
                            <div class="cliente-nome">${cliente.Nome_RazaoSocial}</div>
                            <span class="cliente-tipo tipo-${cliente.Tipo_Cliente.toLowerCase()}">${cliente.Tipo_Cliente}</span>
                        </div>
                        <div class="cliente-info">
                            ${cliente.Tipo_Cliente === 'PF' ? `
                                <div class="info-item">
                                    <span class="info-label">CPF:</span> ${cliente.CPF}
                                </div>
                                <div class="info-item">
                                    <span class="info-label">RG:</span> ${cliente.RG || 'N/A'}
                                </div>
                                <div class="info-item">
                                    <span class="info-label">Nascimento:</span> ${dataNasc}
                                </div>
                            ` : `
                                <div class="info-item">
                                    <span class="info-label">CNPJ:</span> ${cliente.CNPJ}
                                </div>
                                <div class="info-item">
                                    <span class="info-label">IE:</span> ${cliente.Inscricao_Estadual || 'N/A'}
                                </div>
                                <div class="info-item">
                                    <span class="info-label">Responsável:</span> ${cliente.Nome_Responsavel || 'N/A'}
                                </div>
                                <div class="info-item">
                                    <span class="info-label">Abertura:</span> ${dataAbert}
                                </div>
                            `}
                            <div class="info-item">
                                <span class="info-label">E-mail:</span> ${cliente.Email}
                            </div>
                            <div class="info-item">
                                <span class="info-label">Telefone:</span> ${cliente.Telefone}
                            </div>
                            <div class="info-item" style="grid-column: 1/-1;">
                                <span class="info-label">Endereço:</span> ${cliente.Endereco || 'N/A'}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Filtrar clientes localmente (busca)
        function filtrarClientesLocal() {
            const busca = document.getElementById('busca').value.toLowerCase();

            if (!busca) {
                exibirClientes(todosClientes);
                return;
            }

            const clientesFiltrados = todosClientes.filter(c =>
                c.Nome_RazaoSocial.toLowerCase().includes(busca) ||
                (c.CPF && c.CPF.includes(busca)) ||
                (c.CNPJ && c.CNPJ.includes(busca)) ||
                c.Email.toLowerCase().includes(busca)
            );

            exibirClientes(clientesFiltrados);
        }

        // Mostrar mensagem
        function mostrarMensagem(texto, tipo) {
            const mensagem = document.getElementById('mensagem');
            mensagem.innerHTML = `<div class="alert alert-${tipo}">${texto}</div>`;

            setTimeout(() => {
                mensagem.innerHTML = '';
            }, 5000);
        }

        // Limpar formulário
        function limparFormulario() {
            document.getElementById('formCliente').reset();
            alterarTipo();
        }

        // Abrir tab
        function abrirTab(tab) {
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            event.target.classList.add('active');
            document.getElementById(tab).classList.add('active');

            if (tab === 'listagem') {
                carregarClientes();
            }
        }

        // Inicializar
        window.onload = function() {
            alterarTipo();
        };
    </script>
</body>
</html>
